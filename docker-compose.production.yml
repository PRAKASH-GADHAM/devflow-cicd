services:
  app:
    build: .
    container_name: devflow-production
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: 1.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
