name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          set -e
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER}/devflow:latest" >> "$GITHUB_ENV"
          docker build -t "$IMAGE_NAME" .

      - name: Run container health check
        run: |
          set -e
          docker rm -f devflow-demo >/dev/null 2>&1 || true
          docker run -d --name devflow-demo -p 3000:3000 "$IMAGE_NAME"
          sleep 10
          curl -f http://127.0.0.1:3000/api/health
          docker rm -f devflow-demo >/dev/null 2>&1 || true

      - name: Push image to GHCR
        run: |
          set -e
          docker push "$IMAGE_NAME"

  staging:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start staging environment
        run: |
          set -e
          docker compose -f docker-compose.staging.yml up -d --build
          sleep 15
          curl -f http://127.0.0.1:3001/api/health

      - name: Verify staging deployment
        run: |
          echo "Staging deployment completed successfully"

      - name: Cleanup staging environment
        if: always()
        run: docker compose -f docker-compose.staging.yml down --remove-orphans

  production:
    runs-on: ubuntu-latest
    needs: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start production environment
        run: |
          set -e
          docker compose -f docker-compose.production.yml up -d --build
          sleep 15
          curl -f http://127.0.0.1:3002/api/health

      - name: Verify production deployment
        run: |
          echo "Production deployment completed successfully"

      - name: Cleanup production environment
        if: always()
        run: docker compose -f docker-compose.production.yml down --remove-orphans
